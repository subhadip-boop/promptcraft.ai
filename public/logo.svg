<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#brandGradient)" opacity="0.1" stroke="url(#brandGradient)" stroke-width="2"/>
  
  <!-- Prompt Bracket Symbol >
  <g transform="translate(70, 85)">
    <path d="M 5 5 L 15 15 L 5 25" fill="none" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Underscore Symbol _ -->
  <line x1="80" y1="120" x2="100" y2="120" stroke="url(#brandGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Sparkle/Star -->
  <g transform="translate(125, 75)">
    <!-- Star shape -->
    <path d="M 0,-15 L 4,-4 L 15,-2 L 8,5 L 10,16 L 0,10 L -10,16 L -8,5 L -15,-2 L -4,-4 Z" 
          fill="url(#brandGradient)" opacity="0.8"/>
    <!-- Glow effect -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="url(#brandGradient)" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Text -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
        text-anchor="middle" fill="url(#brandGradient)">PromptCraft</text>
</svg>
